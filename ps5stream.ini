# PS5Stream settings. An empty value means auto-detect.
# Device names are printed in the PS5Stream window at launch.

# Capture-card video device name
video=
# Capture-card audio device name (none disables audio)
audio=

# Highest capture mode. A 4K PS5 signal leaves this USB 2 card as 1080p.
max_width=1920
max_height=1080
max_fps=60

# Audio buffer in milliseconds. A short buffer delays the picture less.
audio_buffer_ms=5

# Capture buffer cap in kilobytes. Keep this small so latency cannot grow.
rtbuf_kb=256

# The launchers override this. PS5.bat forces black bars. PS5-blur.bat forces ambient.
# ambient paints the bars from an 8x8 average of the frame. 0 leaves black bars. stretch fills the panel.
fill_screen=0

# 1 starts fullscreen. 0 starts in a window.
fullscreen=1

# Extra ffplay arguments
extra=
